version: "3.8"
services:
  localstack:
    image: localstack/localstack:3
    container_name: localstack
    ports:
      - "4566:4566" # すべてのサービス
      - "127.0.0.1:4510-4559:4510-4559" # external services port range
    environment:
      - SERVICES=s3,lambda,apigateway,iam,sts,ecr,logs,cloudformation
      - DEBUG=1
      - LAMBDA_EXECUTOR=docker
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - "./.localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

  postgres:
    image: postgres:14
    container_name: img-api-postgres
    ports:
      - "5433:5432"  # Changed host port to 5433
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: img_api
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Add pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4
    container_name: img-api-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: img-api-backend
    ports:
      - "3000:3000"
    volumes:
      - ./packages/backend:/app/packages/backend
      - ./packages/shared:/app/packages/shared
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./package.json:/app/package.json
      - /app/node_modules
      - /app/.pnpm-store
      - /app/packages/backend/node_modules
      - /app/packages/shared/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/img_api?schema=public
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_S3_FORCE_PATH_STYLE=true
      - BUCKET=img-api-bucket
      - JWT_SECRET=your-super-secret-jwt-key
    depends_on:
      - localstack
      - postgres

volumes:
  postgres_data:
